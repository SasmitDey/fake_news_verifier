[project]
name = "fake-news-verifier"
version = "0.1.0"
description = "Fake News Detection using ISOT/Reuters Dataset"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "barf>=0.6.0",
    "gensim>=4.4.0",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.7",
    "kagglehub[pandas-datasets,polars-datasets]>=1.0.1",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "polars>=1.40.1",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.4.1",
    "sparqlwrapper>=2.0.0",
    "torch",
    "cuml-cu12==26.4.*",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "uv>=0.11.8",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true


torch = { index = "pytorch-cu126" }
cuml-cu12 = { index = "nvidia" }


[tool.uv]
environments = ["sys_platform == 'linux' and python_version == '3.11'"]
